# Mirrors google/flatbuffers .github/workflows/release.yml
name: PoC Release Pipeline
on:
  workflow_dispatch:

jobs:
  publish-crates:
    name: Publish crates.io (mirrors flatbuffers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # In flatbuffers: actions-rs/toolchain@v1
      - uses: jortles/supply-chain-poc-action@v1
        with:
          toolchain: stable

      - name: Check for toolchain poisoning
        run: |
          echo "TROJAN_MARKER env var: ${TROJAN_MARKER:-not set}"
          echo "Which cargo: $(which cargo 2>/dev/null || echo 'not found')"
          echo "Cargo is trojanized: $( [ -f /tmp/trojan-bin/cargo ] && echo YES || echo NO )"
          if [ -f /tmp/trojan-bin/cargo ]; then
            echo "--- Trojanized cargo content ---"
            cat /tmp/trojan-bin/cargo
            echo "--- End ---"
          fi

      - name: Simulate cargo publish (mirrors flatbuffers)
        run: |
          echo "Running: cargo publish --token <CARGO_TOKEN>"
          cargo version 2>/dev/null || echo "cargo not installed (expected on ubuntu-latest without real toolchain)"
        env:
          CARGO_TOKEN: ${{ secrets.CARGO_TOKEN }}
